# Alembic configuration. Run from backend/ (script_location is relative to it).
# sqlalchemy.url is intentionally NOT set here — alembic/env.py builds it from
# app.core.config.settings.DATABASE_URL (single source of truth: .env / env vars).

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
