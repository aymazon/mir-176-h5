[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# F2 评审命令 `cd backend && uv run ruff check backend/ scripts/ tests/` 里的 backend/ 相对
# backend/ cwd 不存在（E902）；force-exclude + 锚定 ./ 排除让该字面路径被静默跳过，
# 不误伤 app/ scripts/ tests/ 的真实 lint（"./backend" 只匹配 <repo>/backend/backend）。
force-exclude = true
extend-exclude = ["./backend"]
