# mir-176-h5 — nginx site (dell1 生产)
#
# 安装：复制为 /etc/nginx/sites-available/mir 并 symlink 到 sites-enabled（见 INSTALL.md §4）。
# 形态：站点片段（server 块），由 dell1 主 nginx.conf 的 http{} include 载入——
#       不是完整主配置，不能单独 `nginx -t -c` 直接测（本地验证用包装配置，见 INSTALL.md §7）。
#
# 约束（task 33 勘查结论）：
#   - dell1 已有 10 个 site 占用 80/443/8448（443 default_server 已存在）→ mir 独占 8443。
#   - 不动任何既有 site；reload 不断线。
#   - 架构红线：禁止 WebSocket 代理（本文件不得出现 Upgrade/Connection 升级头）。

server {
    # 8443 专用端口（80/443/8448 被既有站点占用，见 task 33）。将来上域名再迁 443 SNI。
    listen 8443 ssl;
    server_name dell1 192.168.1.12;

    # TLS：task 33 自签证书。SNI-friendly —— 将来换正式证书（acme.sh 链路已通）只改这两行。
    ssl_certificate     /etc/nginx/ssl/mir.crt;
    ssl_certificate_key /etc/nginx/ssl/mir.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:mir_ssl:10m;
    ssl_session_timeout 1d;

    # 前端静态产物：vite build → dist/，deploy 经 releases/<ts> + current symlink 切换。
    root /opt/mir-176-h5/current/dist;
    index index.html;

    # 安全响应头（轻量基线）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # vite 指纹资源：长缓存 immutable（文件名带 hash，内容变则文件名变）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 兜底：前端用 react-router createBrowserRouter（history 模式），
    # 深链刷新必须回退 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 长连接端点 —— 必须在 /api/ 之前以更长前缀命中。
    # SSE 三关键配置（plan §3.6，缺一会缓冲/断流）：
    #   proxy_buffering off      —— 事件即时下发，不在 nginx 缓冲
    #   proxy_http_version 1.1   —— SSE 需要 HTTP/1.1 chunked
    #   proxy_read_timeout 3600s —— 长连接空闲不主动断（后端 ping 15s 保活）
    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_cache off;
        gzip off;               # 双重保险：gzip 会缓冲分块响应（Debian 主配置默认 gzip on）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 红线：不设置 Upgrade/Connection —— 不启用 WebSocket。
    }

    # REST API 反代：后端 uvicorn 单进程监听 127.0.0.1:8000（仅本机，不暴露 LAN）。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 红线：不设置 Upgrade/Connection —— 不启用 WebSocket。
    }
}
